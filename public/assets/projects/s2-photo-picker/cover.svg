<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">S2 Photo Picker</title>
  <desc id="desc">Cover illustration for S2 Photo Picker, a web tool for selecting and filtering photos from Google Drive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b9e"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="210" fill="#8b5cf6" opacity=".08"/>
  <circle cx="130" cy="600" r="260" fill="#ff5b9e" opacity=".08"/>

  <g transform="translate(76 74)">
    <rect width="170" height="38" rx="19" fill="#ffffff" opacity=".08"/>
    <circle cx="22" cy="19" r="6" fill="#ff5b9e"/>
    <text x="38" y="24" fill="#d7dcf0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">LIVE PRODUCT</text>

    <text x="0" y="124" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="800" letter-spacing="-2">S2 Photo Picker</text>
    <text x="0" y="172" fill="#aeb6d3" font-family="Inter, Arial, sans-serif" font-size="27">Chọn và lọc ảnh nhanh từ Google Drive</text>

    <g transform="translate(0 226)">
      <rect width="390" height="230" rx="24" fill="#11182a" stroke="#313b5b" filter="url(#shadow)"/>
      <rect x="22" y="22" width="346" height="18" rx="9" fill="#2a3451"/>
      <circle cx="40" cy="31" r="4" fill="#ff5b9e"/>
      <circle cx="54" cy="31" r="4" fill="#8b5cf6"/>
      <circle cx="68" cy="31" r="4" fill="#4ade80"/>
      <text x="25" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Tạo trang chọn ảnh</text>
      <text x="25" y="111" fill="#8893b3" font-family="Inter, Arial, sans-serif" font-size="14">Dán link thư mục Google Drive</text>
      <rect x="25" y="132" width="340" height="44" rx="10" fill="#0b1020" stroke="#35405f"/>
      <text x="40" y="159" fill="#5d6889" font-family="ui-monospace, monospace" font-size="12">drive.google.com/drive/folders/...</text>
      <rect x="252" y="188" width="113" height="30" rx="15" fill="url(#accent)"/>
      <text x="277" y="208" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Tạo trang</text>
    </g>

    <g transform="translate(420 226)">
      <rect width="390" height="230" rx="24" fill="#11182a" stroke="#313b5b" filter="url(#shadow)"/>
      <text x="25" y="48" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Lọc ảnh</text>
      <text x="25" y="76" fill="#8893b3" font-family="Inter, Arial, sans-serif" font-size="14">3 bước · chạy trực tiếp trên trình duyệt</text>
      <g font-family="Inter, Arial, sans-serif" font-size="13">
        <circle cx="42" cy="112" r="15" fill="#8b5cf6"/><text x="38" y="117" fill="#fff" font-weight="700">1</text><text x="70" y="117" fill="#d7dcf0">Chọn thư mục nguồn / đích</text>
        <circle cx="42" cy="154" r="15" fill="#8b5cf6"/><text x="38" y="159" fill="#fff" font-weight="700">2</text><text x="70" y="159" fill="#d7dcf0">Nhập danh sách ảnh cần lọc</text>
        <circle cx="42" cy="196" r="15" fill="#ff5b9e"/><text x="38" y="201" fill="#fff" font-weight="700">3</text><text x="70" y="201" fill="#d7dcf0">Chép hoặc chuyển ảnh</text>
      </g>
    </g>
  </g>

  <g transform="translate(930 248)">
    <rect width="196" height="280" rx="34" fill="#0d1324" stroke="#3b4566" stroke-width="2" filter="url(#shadow)"/>
    <rect x="13" y="16" width="170" height="248" rx="24" fill="#151d31"/>
    <text x="31" y="55" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Album</text>
    <g transform="translate(27 78)">
      <rect width="62" height="70" rx="12" fill="#2a3451"/><circle cx="48" cy="54" r="10" fill="#ff5b9e"/><text x="44" y="59" fill="#fff" font-size="12">♥</text>
      <rect x="80" width="62" height="70" rx="12" fill="#26314d"/><circle cx="128" cy="54" r="10" fill="#ff5b9e"/><text x="124" y="59" fill="#fff" font-size="12">♥</text>
      <rect y="86" width="62" height="70" rx="12" fill="#303a57"/>
      <rect x="80" y="86" width="62" height="70" rx="12" fill="#29334e"/><circle cx="128" cy="140" r="10" fill="#ff5b9e"/><text x="124" y="145" fill="#fff" font-size="12">♥</text>
    </g>
  </g>
</svg>